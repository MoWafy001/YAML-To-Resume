<div class="item">
    <div class="item-row">
        <h2>{{ block.title }}</h2>
        {% if block.date %}
        <span>{{ block.date }}</span>
        {% endif %}
    </div>
    {% if block.description %}
    {% if block.description is string %}
    <p>{{ block.description | format_text }}</p>
    {% else %}
    <ul>
        {% for line in block.description %}
        <li>{{ line | format_text }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% endif %}
</div>
